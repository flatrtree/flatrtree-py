name: Actions

on:
  pull_request:
  push:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  run_tests:
    name: Test Python
    strategy:
      matrix:
        python-version: ["3.14", "3.13", "3.12", "3.11", "3.10", "3.9"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[test,ci]"
      - run: mypy src/ tests/
      - run: black --check src/ tests/
      - run: isort -c src/ tests/
      - run: pytest tests/

  build_sdist:
    name: Build source distribution
    needs: [run_tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Keep this pinned until Cython and mypyc support Python 3.15
          python-version: "3.14"
      - run: pipx run build --sdist --outdir=dist/ .
      - run: pipx run twine check dist/*
      # Installing from the sdist catches missing source files (see issue #1)
      - run: pip install dist/*.tar.gz
      - run: pip install pytest pytest-subtests
      - run: pytest tests/
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [run_tests]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/cibuildwheel@v4.2.0
        with:
          output-dir: dist
      - run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  publish_pypi:
    name: Publish to PyPi
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
