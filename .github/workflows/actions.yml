name: Actions

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

# Cancel superseded PR runs; runs for other events queue per ref instead
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run_tests:
    name: Test Python
    strategy:
      matrix:
        # When adding 3.15, also update the setup-python pin in build_sdist
        # and the cp315-* skip in pyproject.toml
        python-version: ["3.14", "3.13", "3.12", "3.11", "3.10", "3.9"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[test,ci]"
      - run: mypy src/ tests/
      - run: black --check src/ tests/
      - run: isort -c src/ tests/
      - run: pytest tests/

  build_sdist:
    name: Build source distribution
    needs: [run_tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Keep this pinned until Cython and mypyc support Python 3.15,
          # then also update the run_tests matrix and the cp315-* skip in
          # pyproject.toml
          python-version: "3.14"
      # Build with the pinned interpreter (pipx would run build under the
      # runner's system Python)
      - run: pip install build
      - run: python -m build --sdist --outdir=dist/ .
      - run: pipx run twine check dist/*
      # Installing from the sdist catches missing source files (see issue #1)
      - run: pip install "$(echo dist/*.tar.gz)[test]"
      - run: python -c "import pathlib, flatrtree; pkg = pathlib.Path(flatrtree.__file__).parent; assert (pkg / 'py.typed').is_file() and (pkg / '__init__.pyi').is_file(), 'type metadata missing from installed package'"
      # Run the tests shipped in the sdist, not the checkout, so missing
      # test files fail here too
      - run: tar -xf dist/*.tar.gz -C "$RUNNER_TEMP"
      - run: cd "$RUNNER_TEMP"/flatrtree-*/ && pytest tests/
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          # Let re-runs of this job replace the artifact
          overwrite: true

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [run_tests]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/cibuildwheel@v4.2.0
        with:
          output-dir: dist
      - run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl
          # Let re-runs of this job replace the artifact
          overwrite: true

  publish_pypi:
    name: Publish to PyPi
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      # Required for PyPI trusted publishing (OIDC)
      id-token: write
    steps:
      # Download only the dist artifacts; a stray future artifact swept
      # into dist/ would abort the upload
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.2
