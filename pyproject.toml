[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "cython",
    "setuptools",
    "wheel",

    # Needed to run mypyc, which we only use on CPython builds
    "mypy; python_implementation=='CPython'",
    "protobuf; python_implementation=='CPython'",
    "types-protobuf; python_implementation=='CPython'",
]

[tool.black]
extend-exclude = ".*_pb2.py" # exclude generated files

[tool.isort]
profile = "black"
extend_skip_glob = ["src/flatrtree/internal/*"]
skip_gitignore = true

[tool.cibuildwheel]
test-command = "pytest {package}"
test-extras = ["test"]
# PyPy wheels are opt-in since cibuildwheel 3.0. This builds wheels for
# non-EOL PyPy only (3.11 today), narrower than the pp37-pp39 wheels
# shipped with 1.0.0rc2.
enable = ["pypy"]
# cp31?t: no free-threaded wheels yet; sdist installs on free-threaded
#   CPython skip mypyc instead (see setup.py)
# cp315: 3.15 is still at rc1; unskip once Cython/mypyc support it, then
#   also update the run_tests matrix and the setup-python pin in
#   .github/workflows/actions.yml
skip = ["cp31?t-*", "cp315-*"]

# Build native Apple Silicon wheels plus Intel wheels for older Macs. pip
# always prefers these thin wheels, so universal2 is deliberately not built.
[tool.cibuildwheel.macos]
archs = ["auto", "x86_64"]
