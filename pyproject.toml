[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "cython",
    "setuptools",
    "wheel",

    # Needed to run mypyc, which we only use on CPython builds
    "mypy; python_implementation=='CPython'",
    "protobuf; python_implementation=='CPython'",
    "types-protobuf; python_implementation=='CPython'",
]

[tool.black]
extend-exclude = ".*_pb2.py" # exclude generated files

[tool.isort]
profile = "black"
extend_skip_glob = ["src/flatrtree/internal/*"]
skip_gitignore = true

[tool.cibuildwheel]
test-command = "pytest {package}"
test-extras = ["test"]
# PyPy wheels are opt-in since cibuildwheel 3.0
enable = ["pypy"]
# cp31?t: mypyc doesn't support free-threaded CPython
# cp315: 3.15 is still at rc1; unskip once Cython/mypyc support it
skip = ["cp31?t-*", "cp315-*"]

# Build native Apple Silicon and Intel wheels, plus Universal2 CPython wheels
[tool.cibuildwheel.macos]
archs = ["auto", "x86_64", "universal2"]
